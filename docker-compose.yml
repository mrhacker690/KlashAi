version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: klashai
      POSTGRES_USER: klashai
      POSTGRES_PASSWORD: klashai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    environment:
      - DATABASE_URL=postgresql+asyncpg://klashai:klashai@postgres:5432/klashai
      - REDIS_URL=redis://redis:6379
      - DEBUG=true
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:80"]
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
